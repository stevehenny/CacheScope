name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y cmake build-essential libcli11-dev libdwarf-dev libelf-dev libpfm4-dev libglfw3-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCACHESCOPE_BUILD_GUI=ON

      - name: Build
        run: cmake --build build --target cache_scope -- -j$(nproc)

      - name: Package
        run: |
          mkdir dist
          cp build/cachescope_cli dist/cachescope
          tar czvf cachescope-linux-amd64.tar.gz -C dist cachescope

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: cachescope-linux-amd64.tar.gz
